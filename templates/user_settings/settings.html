{% extends 'base.html' %}

{% block content %}
{% if messages %}
<div class="fixed top-20 right-6 z-50 flex flex-col gap-2">
    {% for message in messages %}
    <div class="glass-panel px-6 py-4 rounded-xl border-l-4 border-green-400 shadow-[0_0_20px_rgba(74,222,128,0.2)] flex items-center gap-3 slide-in-toast">
        <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="text-white font-mono-tech tracking-wider text-lg">{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}

<div class="settings-wrap hud-panel">
    <div class="settings-header">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <h2 class="settings-title">SETTINGS</h2>
    </div>

    <form method="POST" class="settings-form">
        {% csrf_token %}

        <label class="setting-row">
            <div class="setting-copy">
                <h3>Dark Mode</h3>
                <p>Deep contrast UI for low light.</p>
            </div>
            <div class="toggle">
                <input type="checkbox" name="dark_mode" class="toggle-input" {% if settings.dark_mode %}checked{% endif %}>
                <span class="toggle-track"></span>
            </div>
        </label>

        <label class="setting-row">
            <div class="setting-copy">
                <h3>Notifications</h3>
                <p>Receive reports via email.</p>
            </div>
            <div class="toggle">
                <input type="checkbox" name="email_notifications" class="toggle-input" {% if settings.email_notifications %}checked{% endif %}>
                <span class="toggle-track"></span>
            </div>
        </label>

        <button type="submit" class="hud-btn-chunky">SAVE PREFERENCES</button>
    </form>
</div>

<script>
    setTimeout(() => {
        document.querySelectorAll('.slide-in-toast').forEach(toast => {
            toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)';
            toast.style.transition = 'all 0.5s ease';
            setTimeout(() => toast.remove(), 500);
        });
    }, 4000);
</script>

<style>
    /* Plain CSS for structure — doesn't depend on the Tailwind build having
       scanned these exact classes (this is what caused the giant unstyled
       gear icon: w-10/h-10 wasn't in the compiled tailwind.css). */

    .settings-wrap {
        max-width: 420px;
        width: 100%;
        margin: 2.5rem auto;
        border-radius: 24px;
        padding: 1.75rem;
    }
    .settings-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        padding-bottom: 1.1rem;
        border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    .settings-icon { width: 26px; height: 26px; flex-shrink: 0; }
    .settings-title { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.1em; color: #fff; }

    .settings-form { display: flex; flex-direction: column; gap: 0.75rem; font-family: 'Share Tech Mono', monospace; }

    .setting-row {
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        background: rgba(0,0,0,0.3); padding: 0.9rem 1.1rem; border-radius: 16px;
        border: 1px solid #334155; cursor: pointer; transition: border-color 0.2s ease;
    }
    .setting-row:hover { border-color: rgba(34, 211, 238, 0.5); }
    .setting-copy h3 { font-size: 1.05rem; color: #22d3ee; font-weight: 700; margin-bottom: 0.15rem; }
    .setting-copy p { font-size: 0.82rem; color: #94a3b8; }

    /* Smaller toggle switch than before */
    .toggle { position: relative; flex-shrink: 0; width: 42px; height: 24px; }
    .toggle-input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
    .toggle-track {
        position: absolute; inset: 0; background: #334155; border-radius: 9999px; transition: background 0.2s ease;
    }
    .toggle-track::after {
        content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
        background: #fff; border-radius: 9999px; transition: transform 0.2s ease;
    }
    .toggle-input:checked + .toggle-track { background: #22d3ee; }
    .toggle-input:checked + .toggle-track::after { transform: translateX(18px); }

    .hud-btn-chunky {
        margin-top: 0.5rem;
        width: 100%; padding: 15px 0; background: #00c2d1; color: #04141a; font-weight: 800;
        letter-spacing: 2px; text-transform: uppercase; border: none; border-radius: 16px;
        font-size: 1rem; border-bottom: 4px solid #007c86; cursor: pointer; transition: all 0.1s ease;
    }
    .hud-btn-chunky:hover { background: #1fd6e6; }
    .hud-btn-chunky:active { border-bottom-width: 0px; transform: translateY(4px); }

    .slide-in-toast { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
</style>
{% endblock %}
