{% extends 'base.html' %}

{% block content %}
<!-- Increased max-w to max-w-lg and padding to p-12 -->
<div class="hud-panel p-12 w-full max-w-lg animate-fade-in">
    
    <div class="flex justify-center mb-8">
        <!-- Enlarged Icon -->
        <div class="w-20 h-20 border-2 border-cyan-400 flex items-center justify-center shadow-[0_0_20px_rgba(0,240,255,0.3)]">
            <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
    </div>

    <!-- Enlarged Title -->
    <h2 class="text-4xl font-bold text-center mb-10 tracking-[0.1em] text-white">IDENTITY_VERIFY</h2>
    
    <form method="POST" class="flex flex-col gap-8 font-mono-tech">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="flex flex-col gap-3">
                <!-- Enlarged Labels -->
                <label class="text-sm text-cyan-400 tracking-widest">> {{ field.label|upper }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="text-red-500 text-sm animate-pulse">! {{ field.errors.0 }}</span>
                {% endif %}
            </div>
        {% endfor %}
        
        <!-- Enlarged Button -->
        <button type="submit" class="hud-btn mt-8 py-5 text-2xl font-bold">
            AUTHENTICATE
        </button>
    </form>
    
    <div class="mt-10 pt-8 border-t border-cyan-500/30 text-center font-mono-tech">
        <p class="text-slate-400 text-sm">
            NO CLEARANCE? <a href="{% url 'register:register' %}" class="text-cyan-400 hover:text-white transition-colors text-base">> REQUEST_ACCESS</a>
        </p>
    </div>
</div>

<style>
    /* Enlarged Tech Inputs */
    input[type="text"],
    input[type="password"],
    input[type="email"] { 
        width: 100% !important; 
        padding: 18px !important; /* Bigger padding */
        background-color: rgba(0,0,0,0.5) !important; 
        border: 1px solid #0055ff !important; 
        color: #00f0ff !important; 
        font-family: 'Share Tech Mono', monospace !important; 
        font-size: 18px !important; /* Bigger text inside input */
        line-height: 1.5 !important;
        letter-spacing: 1px !important;
        transition: border-color 0.3s ease, box-shadow 0.3s ease !important;
    }

    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
</style>
{% endblock %}
